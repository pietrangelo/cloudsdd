openapi: 3.1.0
info:
  title: CloudSDD API
  version: "0.1.0-draft"
  description: >
    Superseded, retained for history. CloudSDD is a CLI tool; the HTTP API
    layer this document sketched was never built and is no longer planned
    (see docs/api.md and docs/cli.md).
    This document currently only exposes the Specification component
    schema, defined in docs/rfc/001-core-architecture-and-json-schema.md
    and implemented in internal/spec, so it can be referenced by future
    RFCs that introduce the API layer.
paths: {}
components:
  schemas:
    Specification:
      type: object
      additionalProperties: false
      required: [sdd_version, intent, resources]
      properties:
        sdd_version:
          type: string
          const: "1.0"
        intent:
          type: string
          enum: [deploy, update, destroy, plan]
        resources:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Resource"
        policies:
          $ref: "#/components/schemas/Policies"
    Resource:
      type: object
      additionalProperties: false
      required: [id, type, provider, properties]
      properties:
        id:
          type: string
          pattern: "^[a-zA-Z0-9_-]{1,63}$"
        type:
          type: string
          enum: [relational_database, object_storage, compute_instance, container_service, cross_account_role]
        provider:
          type: string
          enum: [agnostic, aws, gcp, azure]
        account:
          type: string
          maxLength: 64
          description: >
            Symbolic name of a DeploymentTarget configured at the engine
            level (RFC 004 §2.2), not strictly part of the Specification:
            never an ARN or a credential, only a reference resolved by
            the engine. Optional: if absent, the provider's default
            credentials are used (RFC 002 §2.4).
        scope:
          $ref: "#/components/schemas/Scope"
        schedule:
          $ref: "#/components/schemas/Schedule"
          description: >
            Overrides the Specification-wide `policies.schedule` for this
            resource (RFC 012 §2.1). Absent means inherit; present
            replaces the inherited schedule entirely, including
            `{"enabled": false}` to opt out.
        properties:
          type: object
    Scope:
      description: >
        Where a resource is deployed within its Account (RFC 005 §2.2):
        logical environment, region(s), zones, and whether it is allowed
        to cross an Account/Environment boundary. Orthogonal to `account`
        (RFC 004), which carries which credentials to use.
      type: object
      additionalProperties: false
      properties:
        environment:
          type: string
          pattern: "^[a-zA-Z0-9_-]{1,32}$"
          description: >
            Free-form logical stage name (e.g. "dev", "staging",
            "production"). Optional: absent means unscoped.
        region:
          type: string
          description: >
            Single-region placement. Mutually exclusive with `regions`.
            Format is provider-specific (validated by the resolved
            CloudProvider, not at this layer).
        regions:
          type: array
          minItems: 2
          maxItems: 10
          items:
            type: string
          description: >
            Multi-region placement: the Engine fans this out into one
            Plan/Apply/Validate call per entry (RFC 005 §2.4.2). Mutually
            exclusive with `region`.
        zones:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
          description: >
            Availability-zone pinning/spread, forwarded to
            resource-type-specific HA logic. No ResourceType implemented
            yet consumes it (RFC 005 §2.4.3).
        sealed:
          type: boolean
          default: true
          description: >
            When true (the default when absent), forbids the resource
            from declaring any trust or access relationship toward a
            different Account/Environment (RFC 005 §2.5, "sealed unless
            otherwise specified"). A resource type that is inherently
            cross-boundary (e.g. cross_account_role) must set this
            explicitly to false.
    RelationalDatabaseProperties:
      description: >
        Properties of a Resource with type=relational_database, on any
        provider. Every provider applies the same secure defaults:
        encryption at rest, 7-day automated backups, deletion protection,
        and no public endpoint (RFC 007, 008, 015). Two properties are
        narrower than the rest and say so on the field itself, rather
        than being documented as universal and rejected by one provider —
        which is the defect RFC 015 was written to close.
      type: object
      additionalProperties: false
      required: [engine, version]
      properties:
        engine:
          type: string
          enum: [postgres, mysql, mariadb]
          description: >
            `mariadb` is AWS-only; GCP and Azure accept postgres and
            mysql.
        version:
          type: string
          description: Engine version, e.g. "15" or "8.0".
        high_availability:
          type: boolean
          default: false
          description: >
            Multi-AZ on AWS, REGIONAL on GCP, zone-redundant on Azure,
            with geo-redundant backups where the provider offers them.
        deletion_protection:
          type: boolean
          default: true
          description: >
            On Azure this is enforced by a CanNotDelete management lock
            plus Pulumi's protect flag, since Flexible Server has no
            server-side equivalent; creating the lock requires
            Microsoft.Authorization/locks/write (RFC 015 §2.1).
        skip_final_snapshot:
          type: boolean
          default: false
          description: >
            AWS only. GCP and Azure have no equivalent, so the property
            is rejected there rather than silently ignored.
    ComputeInstanceProperties:
      description: >
        Properties of a Resource with type=compute_instance, on any
        provider (RFC 013 §2.1). Cloud-agnostic by design: the size and
        image are abstract, and each provider maps them onto its own SKU
        and marketplace image. There is deliberately no SSH key, AMI, or
        machine-type property.
      type: object
      additionalProperties: false
      required: [size, os]
      properties:
        size:
          type: string
          enum: [small, medium, large]
        os:
          type: string
          enum: [ubuntu-22.04, ubuntu-24.04, debian-12]
          description: >
            Only images that exist on all three clouds. Provider-specific
            images are excluded so this field's validity never depends on
            `provider`.
        disk_size_gb:
          type: integer
          minimum: 8
          maximum: 1024
          default: 20
        public_ip:
          type: boolean
          default: false
          description: >
            Attaches a public address. Opens no inbound port: the instance
            ships with a default-deny firewall either way.
    S3ObjectStorageProperties:
      description: >
        Properties of a Resource with type=object_storage, provider=aws
        (RFC 002 §2.6). Encryption and block_public_access are secure by
        default when absent. The region is not part of these properties:
        it is expressed via Resource.scope.region (RFC 005 §2.3), which
        this ResourceType requires.
      type: object
      additionalProperties: false
      required: [bucket_name]
      properties:
        bucket_name:
          type: string
          minLength: 3
          maxLength: 63
        versioning:
          type: boolean
          default: false
        encryption:
          type: boolean
          default: true
        block_public_access:
          type: boolean
          default: true
    AWSCrossAccountRoleProperties:
      description: >
        Properties of a Resource with type=cross_account_role,
        provider=aws (RFC 003 §2.2). Requires a non-empty
        Policies.allowed_regions (fail-closed, RFC 003 §2.3). This
        ResourceType is inherently cross-account, so the enclosing
        Resource also requires scope.sealed=false (RFC 005 §2.5) and
        rejects scope.region/regions/zones (IAM is global).
      type: object
      additionalProperties: false
      required: [role_name, trusted_account_id, external_id, permissions, resource_arns]
      properties:
        enabled:
          type: boolean
          default: true
          description: Explicit toggle to suspend the grant without removing the resource from the Specification.
        role_name:
          type: string
          minLength: 1
          maxLength: 64
        trusted_account_id:
          type: string
          pattern: "^[0-9]{12}$"
        external_id:
          type: string
          minLength: 8
          description: Mitigation for the confused deputy problem (mandatory, no default).
        permissions:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            not:
              const: "*"
        resource_arns:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            pattern: "^arn:"
    Policies:
      type: object
      additionalProperties: false
      properties:
        allowed_regions:
          type: array
          items:
            type: string
        allowed_registries:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 253
          description: >
            Container registries a container_service may pull from
            (RFC 017 §2.4). Absent does not mean "anything goes": with no
            allowlist every image must be pinned to a digest, so the
            permissive-looking default is the strict one. Naming a
            registry is how an operator takes responsibility for what its
            mutable tags point at. The `latest` tag is refused either way.
        provider_preference:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum: [aws, gcp, azure]
          description: >
            Ordered tie-break for resources declaring provider "agnostic"
            when more than one registered provider can express them
            (RFC 014 §2.4). "agnostic" is excluded from the values on
            purpose: a preference that could name it would be circular.
        schedule:
          $ref: "#/components/schemas/Schedule"
          description: >
            Declared once for the whole Specification and inherited by
            every schedulable resource (RFC 012 §2.1). A resource that
            declares its own `schedule` overrides it wholesale.
        network:
          $ref: "#/components/schemas/NetworkPolicy"
          description: >
            The operator's address plan (RFC 016 §2.4.2). Absent means
            every scope's range is derived from the default block, which
            is the case that needs no configuration.
    NetworkPolicy:
      description: >
        Confines and, where necessary, overrides the address ranges
        CloudSDD derives for the networks it creates (RFC 016 §2.4).
        Both fields are optional and exist for an operator who already
        has an address plan; a user who never mentions networking still
        gets private, non-overlapping networks.
      type: object
      additionalProperties: false
      properties:
        base_cidr:
          type: string
          description: >
            The block scope networks are carved out of. Must be RFC 1918
            (10/8, 172.16/12, 192.168/16) and no smaller than a /20, so
            at least one scope fits. Defaults to 10.0.0.0/8.
        scopes:
          type: object
          maxProperties: 32
          additionalProperties:
            type: string
          description: >
            Pins individual scopes, keyed "account::environment::region"
            with empty segments omitted. The escape hatch when two scopes
            derive the same range, and the way to honour a plan that
            assigns ranges by hand. A pinned range is validated exactly
            as a derived one is: RFC 1918, inside base_cidr, and not
            overlapping another scope in the same account.
    Schedule:
      description: >
        When a resource is powered on (RFC 012). Absent, or with
        `enabled` false, the resource is never powered down.
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          default: false
          description: >
            Scheduling is opt-in: an environment nobody asked to shut
            down never shuts down.
        timezone:
          type: string
          description: >
            IANA zone name, e.g. "Europe/Rome". Fixed offsets are
            rejected: they drift by an hour across a DST boundary.
        start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Wall-clock power-on time in `timezone`.
        stop:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: >
            Wall-clock power-off time in `timezone`. A `stop` earlier
            than `start` describes an overnight window and is valid.
        days:
          type: array
          maxItems: 7
          uniqueItems: true
          items:
            type: string
            enum: [mon, tue, wed, thu, fri, sat, sun]
          description: >
            Weekdays the resource is powered on. Absent means Monday to
            Friday, which leaves the weekend off by construction.
        exceptions:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/ScheduleWindow"
          description: >
            Date ranges over which the weekly rhythm is suspended.
            Windows may not overlap.
    ScheduleWindow:
      type: object
      additionalProperties: false
      required: [from, to, mode]
      properties:
        from:
          type: string
          format: date
          description: First day of the window, inclusive.
        to:
          type: string
          format: date
          description: Last day of the window, inclusive.
        mode:
          type: string
          enum: [always_on, always_off]
        reason:
          type: string
          maxLength: 128
          description: >
            Free-form documentation carried into the plan output.
            Originates in a natural language prompt, so it is length
            capped and sanitized before display.
